<svg xmlns="http://www.w3.org/2000/svg" width="495" height="190" viewBox="0 0 495 190" fill="none" role="img" aria-labelledby="t d">
<title id="t">Most used languages</title>
<desc id="d">TypeScript 45.6%, JavaScript 17.6%, Python 12.4%, CSS 11.7%, HTML 10.4%, Vue 1.3%, C++ 0.9%, Dockerfile 0.1%</desc>
<style>
  .header { font: 600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #00f3ff; animation: fade .8s ease-in-out forwards }
  .lang { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #c9d1d9 }
  .item { opacity: 0; animation: rise .4s ease-out forwards }
  .seg { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
          animation: grow .7s ease-out forwards }
  @keyframes grow { to { transform: scaleX(1) } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: scale(1) } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important; animation-delay: 0s !important } }
</style>
<rect x="0.5" y="0.5" width="494" height="189" rx="11.5" fill="#0a0a0f" stroke="#0b3a40"/>
