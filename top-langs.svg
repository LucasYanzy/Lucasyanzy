  <rect class="seg" style="animation-delay: 470ms" x="366.37" y="52" width="52.93" height="8" fill="#663399"/>
  <rect class="seg" style="animation-delay: 560ms" x="418.80" y="52" width="38.85" height="8" fill="#e34c26"/>
  <rect class="seg" style="animation-delay: 650ms" x="457.15" y="52" width="5.21" height="8" fill="#41b883"/>
  <rect class="seg" style="animation-delay: 740ms" x="461.86" y="52" width="5.19" height="8" fill="#012456"/>
  <rect class="seg" style="animation-delay: 830ms" x="466.55" y="52" width="3.95" height="8" fill="#f34b7d"/>
</g>
<g transform="translate(25, 85)"><g class="item" style="animation-delay: 450ms"><circle cx="5" cy="-4" r="5" fill="#3178c6"/><text class="lang" x="17" y="0">TypeScript 45.82%</text></g></g>
