name: TokenTracker profile structure probe (temporary)

on:
  push:
    paths: [".github/workflows/tt-profile-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Which period values does the profile endpoint accept?
        run: |
          uid="28d52253-68ed-4de0-978b-8e70fe5eb800"
          base="https://srctyff5.us-east.insforge.app/functions/tokentracker-leaderboard-profile"
          for q in "" "period=total" "period=all" "period=month" "period=week" "period=year" "range=total" "period=total&include=all"; do
            code=$(curl -sS -m 20 -o /tmp/p.json -w "%{http_code}" "$base?user_id=$uid&$q")
            echo "=== [$q] -> HTTP $code"
            jq -c '{period: .period, tokens: .totals.total_tokens, cost: .totals.estimated_cost_usd, providers: (.by_provider // [] | map({s: .source, t: .total_tokens, p: ((.percent*1000|round)/10)}))}' /tmp/p.json 2>/dev/null | cut -c1-420
          done
