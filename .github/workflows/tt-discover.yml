name: TokenTracker discovery (temporary)

on:
  push:
    paths: [".github/workflows/tt-discover.yml"]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repo files that look related to cards / badges / profiles / functions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/xiufengsun/TokenTracker/git/trees/main?recursive=1" -o /tmp/tree.json
          echo "truncated: $(jq -r .truncated /tmp/tree.json)  total paths: $(jq '.tree|length' /tmp/tree.json)"
          jq -r '.tree[].path' /tmp/tree.json | grep -iE 'badge|card|share|og[-_]?image|leaderboard|profile|insforge|functions/' | grep -viE 'node_modules|\.png$|\.jpg$|\.webp$|\.svg$|test|locale|i18n' | head -120

      - name: Probe guessed function endpoints (HTTP status only)
        run: |
          uid="28d52253-68ed-4de0-978b-8e70fe5eb800"
          base="https://srctyff5.us-east.insforge.app/functions"
          for f in tokentracker-badge-svg tokentracker-card-svg tokentracker-profile-card tokentracker-share-card tokentracker-card tokentracker-og tokentracker-og-image tokentracker-profile tokentracker-leaderboard-profile tokentracker-public-profile tokentracker-user-summary tokentracker-user-stats tokentracker-leaderboard tokentracker-stats-svg tokentracker-summary-svg; do
            code=$(curl -s -o /tmp/o.bin -w "%{http_code}" -m 15 "$base/$f?user_id=$uid")
            printf "%-34s %s  %s bytes\n" "$f" "$code" "$(wc -c < /tmp/o.bin)"
          done
