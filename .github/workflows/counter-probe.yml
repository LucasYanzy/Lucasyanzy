name: Profile views counter probe (temporary)

on:
  push:
    paths: [".github/workflows/counter-probe.yml", "Readme.md"]

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch the candidate badges of PR 22 through GitHub's camo proxy
        run: |
          curl -sS -m 30 -H "Accept: application/vnd.github.html+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o /tmp/pr.html -w "rendered markdown HTTP %{http_code}, %{size_download} bytes\n" "https://api.github.com/repos/LucasYanzy/Lucasyanzy/readme?ref=claude/nifty-allen-pkup8y"
          python3 - <<'PY'
          import re, subprocess
          html = open('/tmp/pr.html', encoding='utf-8', errors='replace').read()
          urls = []
          for u in re.findall(r'https:(?:\\u002F|\\/|/){2}camo\.githubusercontent\.com(?:\\u002F|\\/|/)[0-9a-f]+(?:\\u002F|\\/|/)[0-9a-f]+', html):
              u = u.replace('\\u002F', '/').replace('\\/', '/')
              if u not in urls:
                  urls.append(u)
          print("distinct camo urls found:", len(urls))
          for url in urls:
              try:
                  origin = bytes.fromhex(url.rsplit('/', 1)[1]).decode()
              except Exception:
                  origin = '?'
              label = re.sub(r'^https://', '', origin)[:70]
              for attempt in (1,):
                  out = subprocess.run(
                      ['curl', '-sS', '-m', '25', '-A', 'Mozilla/5.0', '-o', '/tmp/c.bin', '-D', '/tmp/c.h',
                       '-w', '%{http_code} %{time_total}s %{size_download}B', url],
                      capture_output=True, text=True)
                  ctype = ''
                  for line in open('/tmp/c.h', errors='replace'):
                      if line.lower().startswith('content-type'):
                          ctype = line.strip()
                  body = open('/tmp/c.bin', 'rb').read()
                  nums = re.findall(rb'>([^<>]{1,40})</text>', body)[:6] if b'<svg' in body else []
                  print(f"- {label} try {attempt}: {out.stdout.strip() or out.stderr.strip()} | {ctype}")
                  if nums:
                      print("    text:", [n.decode('utf-8', 'replace') for n in nums])
                  elif b'<svg' not in body:
                      print("    body:", body[:120])
          PY
