name: Profile views counter probe (temporary)

on:
  push:
    paths: [".github/workflows/counter-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch the candidate badges of PR 22 through GitHub's camo proxy
        run: |
          curl -sS -m 30 -L -A "Mozilla/5.0" -o /tmp/pr.html -w "PR page HTTP %{http_code}, %{size_download} bytes\n" "https://github.com/LucasYanzy/Lucasyanzy/pull/22"
          python3 - <<'PY'
          import re, subprocess
          html = open('/tmp/pr.html', encoding='utf-8', errors='replace').read()
          tags = re.findall(r'<img[^>]*?src="https://camo\.githubusercontent\.com/[^"]+"[^>]*>', html)
          print("camo images found:", len(tags))
          for tag in tags:
              url = re.search(r'src="([^"]+)"', tag).group(1).replace('&amp;', '&')
              alt = re.search(r'alt="([^"]*)"', tag)
              alt = alt.group(1)[:30] if alt else '?'
              if len(alt) > 2:
                  continue
              for attempt in (1, 2):
                  out = subprocess.run(
                      ['curl', '-sS', '-m', '25', '-A', 'Mozilla/5.0', '-o', '/tmp/c.bin', '-D', '/tmp/c.h',
                       '-w', '%{http_code} %{time_total}s %{size_download}B', url],
                      capture_output=True, text=True)
                  ctype = ''
                  for line in open('/tmp/c.h', errors='replace'):
                      if line.lower().startswith('content-type'):
                          ctype = line.strip()
                  body = open('/tmp/c.bin', 'rb').read()
                  nums = re.findall(rb'>([^<>]{1,40})</text>', body)[:6] if b'<svg' in body else []
                  print(f"- candidate {alt} try {attempt}: {out.stdout.strip() or out.stderr.strip()} | {ctype}")
                  if nums:
                      print("    text:", [n.decode('utf-8', 'replace') for n in nums])
                  elif b'<svg' not in body:
                      print("    body:", body[:120])
          PY
